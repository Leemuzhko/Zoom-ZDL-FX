name: Package ZDL release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build distribution ZIPs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME//\//-}"
          DIST="Zoom-ZDL-FX-${VERSION}"
          ALL_ZIP="All-ZDL-FX-${VERSION}.zip"
          mkdir -p release-assets "package/${DIST}"
          cp -a zdl "package/${DIST}/zdl"
          cp -a assets "package/${DIST}/assets"
          cp README.md README.ru.md LICENSE "package/${DIST}/"

          (cd package && zip -r "../release-assets/${ALL_ZIP}" "${DIST}")

          while IFS= read -r -d '' EFFECT_DIR; do
            EFFECT_NAME="$(basename "${EFFECT_DIR}")"
            (cd zdl && zip -r "../release-assets/${EFFECT_NAME}.zip" "${EFFECT_NAME}")
          done < <(find zdl -mindepth 1 -maxdepth 1 -type d -print0)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zoom-ZDL-FX-${{ github.ref_name }}
          path: release-assets/*.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
