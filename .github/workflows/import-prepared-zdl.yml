name: Import prepared ZDL bundle

on:
  push:
    branches:
      - docs/readme-downloads-funding
    paths:
      - ".staging/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-downloads-funding
          fetch-depth: 0

      - name: Rebuild prepared repository files
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/part-* > /tmp/deploy.b64
          base64 -d /tmp/deploy.b64 > /tmp/deploy.zip
          rm -rf /tmp/deploy
          mkdir -p /tmp/deploy
          unzip -q /tmp/deploy.zip -d /tmp/deploy

          SRC=/tmp/deploy/zoom_repo_deploy

          rm -rf zdl
          cp -a "$SRC/zdl" ./zdl
          cp "$SRC/README.md" README.md
          cp "$SRC/README.ru.md" README.ru.md
          cp "$SRC/LICENSE" LICENSE

          mkdir -p .github/workflows
          cp "$SRC/.github/FUNDING.yml" .github/FUNDING.yml
          cp "$SRC/.github/workflows/package-release.yml" .github/workflows/package-release.yml

          rm -rf .staging
          rm -f .github/workflows/import-prepared-zdl.yml

      - name: Commit imported bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: reorganize ready effects into Zoom Effect Manager packages"
          git push origin HEAD:docs/readme-downloads-funding
